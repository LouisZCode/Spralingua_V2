# Grammatik-Tandem topics (TANDEM-001, Phase 3 MVP; grown TAND-005)
#
# Content-as-data, like the lesson YAMLs and satz packs — NOT a lesson, so the
# lesson loader never touches it. The frontend topic screen shows 3 random
# picks from this pool as suggestion cards, with a shuffle to re-roll a fresh
# 3, and the learner can also type their own ("or talk about…"). The chosen
# topic rides to the backend as the `?topic=` WebSocket query param and is
# injected into the tandem short-term layer.
#
# Kept as everyday, all-level conversation themes phrased as stage directions
# (English), so the same string reads naturally both as a user-facing choice
# AND injected into the (English) persona prompt. The conversation itself is
# always German. Growing this list is a data edit, not code.
#
# ~50 topics total: the original 16 (kept verbatim) plus a TAND-005 batch that
# echoes the errands/doctor/neighbors/work-small-talk/travel-mishap/apartment
# life areas already covered by szenario/scenarios.yaml and the drill pools
# (bauteil, verbindungen, sprechen), so the practice modes reinforce each
# other, mixed with fresh everyday and opinion themes.

topics:
  - Your weekend
  - Food and cooking
  - Travel and places you've been
  - Music and concerts
  - Films and series
  - Your work or studies
  - Where you grew up
  - Hobbies and free time
