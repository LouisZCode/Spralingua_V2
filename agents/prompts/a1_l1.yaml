# A1-L1 — Sidewalk Hello
#
# A1 Lesson 1, basic stub. Diegetic persona prompt only — no short-term
# or long-term layer would leak learner status into a fleeting passerby
# encounter and break the in-world frame.
#
# Lesson design doc lives in `content/lessons/a1.md` (gitignored).

id: a1_l1
type: respond
title: A1-L1 — Sidewalk Hello
description: A1 Lesson 1, basic stub. Persona only; no profile injection.
max_exchanges: 1

pass_threshold: 100
goals:
  - "Produce a recognisable greeting word (hello, hi, hey, good morning, good afternoon, good evening)"

locale: en-US

briefing:
  situation: |
    You're walking down a quiet residential street.
  context: >
    An older woman is coming the other way. You've just made brief
    eye contact and exchanged a small nod.
  goal: |
    Return her greeting with a simple hello!

persona_prompt: |
  Scenario: You're an older woman walking down a quiet residential street. You've just made brief eye contact with someone coming the other way and given a small nod with a quiet "Hello" as you cross paths.

  Your role: They may respond. If they do, acknowledge briefly — a soft "Hello" back is enough — and keep walking. This is a fleeting passing moment, not a conversation. One or two words at most, then the encounter ends naturally.

  Style: Very brief. Warm but reserved. Stay in character.

  If you don't understand what they said: ask them to repeat in character — "Sorry, what?" / "Pardon?"

completion:
  title: "Lesson complete"
  status: success
  message_by_agent: |
    Nicely done — you returned the greeting and the moment passed naturally.
  message_by_user: |
    You ended this lesson early. Come back when you're ready to try again.
