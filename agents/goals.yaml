lesson_zero:
  language: English
  goal_text: "Introduce yourself and ask one personal question back"
  pass_criterion: |
    The learner stated at least one fact about themselves AND asked the persona
    at least one personal question (name, where they are from, what they do, etc.).
    Pure responses with no return question do not pass.

a1_l1:
  language: English
  goal_text: "Respond to a greeting"
  pass_criterion: |
    The learner returned the persona's greeting with a recognisable greeting of
    their own ("hello", "hi", "good morning", etc.) within their first one or two
    turns. Saying nothing or skipping straight to another topic does not pass.
