# Bauteil-Sätze item catalog (GRAM-002, Exercise A) — build the inflected
# phrase from raw parts. Content-as-data like satz/packs: a dev adds an item
# by appending here; bauteil/content.py validates fail-loud at startup.
#
# Fields per item (article optional, everything else required):
#   id         — stable slug
#   pattern_id — grammar/taxonomy.yaml id this item drills (the ledger key)
#   case       — nominative | accusative | dative (what the frame forces)
#   gender     — m | f | n | pl
#   article    — the article-type slot of the rotation (omit for bare phrases)
#   parts      — the raw, uninflected parts shown to the learner
#   frame      — the sentence with ONE ___ gap; the frame decides the case
#   answer     — the correctly inflected phrase that fits the gap
#   hint       — English rendering of the full sentence (comprehension aid)
#
# Design rules honored (todo GRAM-002): vocabulary is IMPOSED, not drawn from
# the learner's Satzschmiede pool (familiar words let the ending be dodged —
# the user's own topic-1 finding); the rotation lands the strong "flag" ending
# in every slot: all three cases, all genders, definite / ein-type / bare,
# including the three naked ein-spots (masc-nom, neut-nom, neut-acc); weak-
# noun items MIX in non-weak decoys so "does this noun even bend?" stays a
# live decision (rule 1: block the escape route).

items:
  # ── adjektivendungen · definite article (weak endings) ─────────────────
