# Scenario catalog — starter set + CONT-001 growth batches.
#
# Szenario-Sparring (P1, thin slice) scenario catalog. Content-as-data like
# sprechen/tasks.yaml; szenario/content.py validates fail-loud at startup.
#
# Fields per scenario (all required):
#   id             — stable slug
#   stufe          — difficulty tier (int); always 1 in this starter set
#                    (low-pressure, everyday situations)
#   persona        — { name, role, attitude }. role is German
#                    (e.g. "Verkäufer im Spieleladen"); attitude is "friendly"
#                    for every Stufe-1 scenario
#   register       — "du" | "Sie": the address form the persona uses. du is
#                    the default (daily life in Germany runs on du); Sie only
#                    where the scene genuinely demands it (official desks,
#                    medical counters, surname-addressed strangers).
#   kontext        — ONE English sentence setting the scene, shown to the
#                    learner before the question
#   questions_a1   — 4 easier (A1) questions for the same persona/scene —
#                    answerable in one short present-tense main clause
#                    (sein/haben/mögen, gern/lieber, either-or, yes/no,
#                    simple W-questions). Same register as the scene.
#   questions_a2   — 4 easier (A2) questions for the same persona/scene —
#                    answerable with 1-2 clauses; Perfekt, "Warum ...?" and
#                    a simple "wenn ..." condition are fine. Same register
#                    as the scene.
#   questions      — 3-5 German questions this persona might casually ask
#                    (the B1 tier); one is picked at random at runtime
#   questions_b2   — 4 harder (B2) questions for the same persona/scene —
#                    opinion + justification, hypotheticals (Konjunktiv II),
#                    trade-offs, nuanced experience. Same register as the
#                    scene. Served when the learner toggles B2 (SZEN-005)
#   ziel_vokabular — 4-8 German domain nouns for the scene, each WITH its
#                    article

scenarios:
  - id: spieleladen
    stufe: 1
    register: du
    persona:
      name: Jonas
      role: Verkäufer im Spieleladen
      attitude: friendly
    kontext: >-
      You're browsing in a small board-game shop and the clerk starts
      chatting with you while you look at the shelves.
    questions_a1:
      - Magst du Brettspiele?
      - Bist du zum ersten Mal hier?
      - Kaufst du gern Spiele als Geschenk?
      - Was ist dein Lieblingsspiel?
    questions_a2:
      - Warum spielst du gern Brettspiele?
      - Was hast du am Wochenende mit deinen Freunden vor?
      - Spielst du lieber neue Spiele, oder magst du lieber die Klassiker?
      - Was machst du, wenn eine Anleitung zu kompliziert ist?
    questions:
      - Suchst du ein Geschenk oder ist das für dich selbst?
      - Spielst du lieber mit Freunden oder in der Familie?
      - Magst du eher einfache Spiele oder komplizierte Strategiespiele?
      - Hast du schon mal ein Kartenspiel gespielt?
      - Wie viele Spieler sollen mitspielen können?
    questions_b2:
      - Warum, glaubst du, werden komplizierte Strategiespiele gerade wieder so beliebt?
      - Was würdest du machen, wenn die Anleitung komplett auf Englisch wäre?
      - Was spricht für dich eigentlich gegen ein teures Sammlerspiel als Geschenk?
      - Gab es mal ein Spiel, bei dem du dich richtig über die Regeln geärgert hast?
    ziel_vokabular:
      - der Spieleladen
      - das Brettspiel
      - das Kartenspiel
      - der Spieler
      - die Regel
      - das Geschenk
      - der Preis
      - die Anleitung

