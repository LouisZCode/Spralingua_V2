[project]
name = "Spralingua-V2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.2",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "azure-cognitiveservices-speech>=1.50.0",
    "boto3>=1.43.73",
    "fastapi>=0.128.0",
    "google-auth>=2.53.0",
    "greenlet>=3.0",
    "langchain>=1.2.0",
    "langchain-cerebras>=0.8.2",
    "langchain-openai>=1.1.6",
    "opentelemetry-api>=1.42.0",
    "opentelemetry-exporter-otlp-proto-http>=1.42.0",
    "opentelemetry-sdk>=1.42.0",
    "pipecat>=0.3.0",
    "pipecat-ai[deepgram,silero]>=0.0.98",
    "psycopg2-binary>=2.9",
    "pydub>=0.25.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "requests>=2.32.5",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.40.0",
]

# Dev/local-only: gradio (voice_tests UI) + pyaudio (local mic, services/transport
# transport_vad). The backend Dockerfile runs `uv sync --no-dev`, so these stay
# out of the production image while local `uv sync` still installs them.
[dependency-groups]
dev = [
    "gradio>=6.2.0",
    "pyaudio>=0.2.14",
]
