    forces: >-
      Constraint: at least 3 main clauses, each opening with a non-subject
      element (a kitchen place or a step word). In each, the conjugated verb
      must come IMMEDIATELY after that opener (position two), subject after
      the verb. A sentence that starts with the subject does not count toward
      the three.
    min_elements: 3
    keyterms: [Pfanne, Ofen, Zutaten, zuerst]

  - id: v2-freunde
