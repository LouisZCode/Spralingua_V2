    pattern_id: perfekt-satzklammer
    title: Neues Hobby (Perfekt)
    prompt: >-
      Tell me about the last time you tried a new hobby or activity — what
      happened? Three sentences, in the past, and every sentence must say
      WHAT or WHERE (an object or a place), so something sits between the two
      verb parts.
    forces: >-
      Constraint: 3 past-tense clauses, each with material inside the verb
      bracket — haben/sein in position two, Partizip II at the END, and at
      least an object or place phrase between them. An empty bracket
      (auxiliary immediately followed by the participle) does not count
      toward the three.
    keyterms: [Hobby, ausprobiert, Kurs]

  - id: modal-abendessen
    pattern_id: modalverb-infinitiv-ende
    title: Das Abendessen planen
    prompt: >-
      You're planning a dinner for friends: one thing you WANT to cook, one
      thing you MUST buy beforehand, and one thing you probably CAN'T finish
      in time. Use wollen/möchten, müssen and können — one each.
    forces: >-
      Constraint: three clauses with three DIFFERENT modal verbs (wollen or
      möchten, müssen, können). In each, the modal stands in position two and
      the full verb goes to the very END as an infinitive ("Ich möchte eine
