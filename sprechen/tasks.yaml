    forces: >-
      Constraint: "wenn" appears at least twice, each opening a conditional
      clause. In EVERY wenn-clause the conjugated verb must stand at the
      very end ("wenn ich befördert werde", never "wenn ich werde
      befördert"). Only the wenn-clause verb position is checked, not the
      dann-clause.
    keyterms: [wenn, Zukunft, Geld]

  - id: obwohl-job
    pattern_id: nebensatz-verbende
    title: obwohl × 2 (Der Job)
    prompt: >-
      Tell me two things about your job or work life using "obwohl" —
      something true even though something else is the case, e.g. "Obwohl
