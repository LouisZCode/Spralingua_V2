    min_elements: 3
    distinct: true   # GRAM-008: N *different* elements — the count override may not rescue this task
    keyterms: [aufhören, zurückrufen, weitermachen, vorbeikommen, abgeben]

  # ── CONT-001 growth batch (2026-07-19) — food/friends/weather/home lens ──
