    keyterms: [Geburtstag]

  - id: perfekt-ausflug
    pattern_id: perfekt-satzklammer
    title: Der Ausflug (Perfekt)
    prompt: >-
      Describe a day trip or outing (Ausflug) you took recently — in the
      past, three sentences, and every sentence must say WHAT or WHERE (an
      object or a place), so something sits between the two verb parts.
    forces: >-
      Constraint: 3 past-tense clauses, each with material inside the verb
      bracket — haben/sein in position two, Partizip II at the END, and at
      least an object or place phrase between them. An empty bracket
      (auxiliary immediately followed by the participle) does not count
      toward the three.
    keyterms: [Ausflug]

  # ── modalverb-infinitiv-ende ────────────────────────────────────────────
  - id: modal-traumreise
    pattern_id: modalverb-infinitiv-ende
    title: Die Traumreise
    prompt: >-
      Tell me about a dream trip: one thing you WANT to do there, one thing
      you'll MUST arrange beforehand, and one thing you probably CAN'T do.
      Use wollen/möchten, müssen and können — one each.
    forces: >-
      Constraint: three clauses with three DIFFERENT modal verbs (wollen or
      möchten, müssen, können). In each, the modal stands in position two
      and the full verb goes to the very END as an infinitive ("Ich möchte
      dort tauchen gehen", never "Ich möchte gehen dort tauchen").
    keyterms: [möchte, muss, kann]

  - id: modal-buero-regeln
    pattern_id: modalverb-infinitiv-ende
    title: Büro-Regeln
    prompt: >-
      Invent two rules for a perfect shared office — use "man muss" in one
      and "man darf nicht" in the other.
    forces: >-
      Constraint: two rules, one with "man muss", one with "man darf nicht".
      Modal in position two, the infinitive at the very END of each rule.
    keyterms: [muss, darf]

  # ── trennbare-verben ────────────────────────────────────────────────────
  - id: trenn-wochenende
    pattern_id: trennbare-verben
    title: Das Wochenende, zerlegt
    prompt: >-
      Describe your typical weekend in three sentences, using at least
      three of these verbs: aufräumen, ausschlafen, einladen, mitkommen,
      vorbereiten. Present tense.
    forces: >-
      Constraint: at least three of the listed separable verbs, in present-
      tense MAIN clauses — so each prefix must split off to the END of its
      clause ("Ich räume samstags auf", never "Ich aufräume samstags"). A
      verb hidden behind a modal (infinitive, prefix unsplit) does not
      count toward the three.
    keyterms: [aufräumen, ausschlafen, einladen, mitkommen, vorbereiten]

  - id: trenn-arbeitstag
    pattern_id: trennbare-verben
    title: Der Arbeitstag
    prompt: >-
      Describe a typical workday — use at least three of these verbs:
      aufhören, zurückrufen, weitermachen, vorbeikommen, abgeben. Present
      tense.
    forces: >-
      Constraint: at least three of the listed separable verbs, in present-
      tense MAIN clauses, prefix split to the clause END ("Ich höre um
      sechzehn Uhr auf", never "Ich aufhöre um sechzehn Uhr"). Modal +
      infinitive constructions (prefix unsplit) do not satisfy the
      constraint.
    keyterms: [aufhören, zurückrufen, weitermachen, vorbeikommen, abgeben]

  # ── CONT-001 growth batch (2026-07-19) — food/friends/weather/home lens ──
  - id: v2-rezept
    pattern_id: v2-wortstellung
    title: In der Pfanne · Im Ofen · Zum Schluss
    prompt: >-
      Tell me how you cook your favorite dish — but start EVERY sentence with
      something other than the subject: a place in the kitchen (In der Pfanne,
      Im Ofen, Auf dem Teller) or a step word (Zuerst, Dann, Zum Schluss). At
      least 3 sentences.
    forces: >-
      Constraint: at least 3 main clauses, each opening with a non-subject
      element (a kitchen place or a step word). In each, the conjugated verb
      must come IMMEDIATELY after that opener (position two), subject after
      the verb. A sentence that starts with the subject does not count toward
      the three.
    keyterms: [Pfanne, Ofen, Zutaten, zuerst]

  - id: v2-freunde
    pattern_id: v2-wortstellung
    title: Damals · Heute · Neulich
    prompt: >-
      Tell me about your best friend — how you met and what you do together —
      but start EVERY sentence with something other than the subject: a time
      word like Damals, Heute, or Neulich. At least 3 sentences.
    forces: >-
      Constraint: at least 3 main clauses, each opening with a non-subject
      time word (Damals, Heute, Neulich, …). In each, the conjugated verb must
      come IMMEDIATELY after that opener (position two), subject after the
      verb. A sentence that starts with the subject does not count toward the
      three.
    keyterms: [damals, heute, neulich]

  - id: wenn-wetter
    pattern_id: nebensatz-verbende
    title: wenn × 2
    prompt: >-
      What do you do when the weather is nice, and what do you do when it's
      bad? Answer in two or three sentences — and use "wenn" twice.
    forces: >-
      Constraint: "wenn" appears at least twice. In EVERY wenn-clause the
      conjugated verb must stand at the very end ("wenn das Wetter schön
      ist", never "wenn ist das Wetter schön").
    keyterms: [wenn, Wetter, regnet]

  - id: obwohl-freundschaft
    pattern_id: nebensatz-verbende
    title: obwohl × 2
    prompt: >-
      Tell me two good things about a friendship of yours — but for each one,
      add an "obwohl" twist: something that isn't ideal, but doesn't change
      how you feel. Use "obwohl" twice.
    forces: >-
      Constraint: "obwohl" appears at least twice. In EVERY obwohl-clause the
      conjugated verb must stand at the very end ("obwohl wir uns selten
      sehen", never "obwohl wir sehen uns selten").
    keyterms: [obwohl]

  - id: perfekt-regentag
    pattern_id: perfekt-satzklammer
    title: Ein Regentag (Perfekt)
    prompt: >-
      Tell me about the last rainy or snowy day you remember — what did you
      do at home? At least three things, in the past.
    forces: >-
      Constraint: at least 3 past-tense clauses (count aux+participle pairs
      or war/hatte clauses, not sentences). In Perfekt clauses haben/sein must
      stand in position two and the Partizip II at the very END, with
      objects/places inside the bracket ("Ich habe einen Film geschaut",
      never "Ich habe geschaut einen Film"). Präteritum war/hatte/wollte
      counts as a valid past sentence too.
    keyterms: [Regen, Film, Tee]

