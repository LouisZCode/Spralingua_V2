# Briefkasten — the seed pool.
#
# A seed is the SITUATION, never the letter. `briefkasten/writer.py` writes
# the actual German at request time, weaving in the learner's own deck words
# (CONT-002), so the same seed never produces the same letter twice.
#
# `register` is a real parameter, not decoration: informal seeds use "du" and
# everyday German, formal seeds use "Sie" and real Behörden/Geschäft register.
# The writer, both judges, and the "how would a German write this" pass all
# read it. Ship both — a learner who only ever writes to friends never learns
# the register they actually need for a Mietvertrag or an Amt.
#
# `level` drives the word target (briefkasten/content.py::WORD_TARGETS), which
# is what the learner is asked to write and what the score is judged against.
#
# `points` are ENGLISH — they are instructions to the learner, not content of
# the letter. Exactly 4, each one concretely checkable, because the hint judge
# reports per-point coverage back as a checklist.

seeds:
  # ---------------------------------------------------------------- informal
  - id: katrin-umzug
    register: informal
    level: a2
    sender:
      name: Katrin
      relation: an old friend who has just moved to Hamburg
    situation: >
      She has finally moved into her new flat in Hamburg after a chaotic
      week of boxes and paperwork. The flat is smaller than she hoped but
      the neighbourhood is lovely. She misses her old circle and wants to
      hear what you have been up to.
    points:
      - Congratulate her on the new flat
      - Tell her how your own week has been
      - Ask two questions about Hamburg
      - Suggest when you could come and visit

  - id: jonas-geburtstag
    register: informal
    level: a1
    sender:
      name: Jonas
      relation: a friend from your German course
    situation: >
      He is turning thirty next month and is planning a small party at his
      place on a Saturday. He is not sure yet how many people are coming or
      what food to make, and he would like you to be there.
    points:
      - Thank him for the invitation
      - Say whether you can come
      - Ask what you should bring
      - Ask who else will be there

  - id: tandem-partnerin
    register: informal
    level: a2
    sender:
      name: Svenja
      relation: someone you were matched with on a language-exchange app
    situation: >
      This is her first message to you. She is learning your language, works
      as a nurse in Leipzig, and has an irregular shift schedule. She wants
      to introduce herself and work out how the two of you could practise
      together every week.
    points:
      - Introduce yourself briefly
      - Say why you are learning German
      - Tell her when you are usually free
      - Ask her something about her work

  - id: wg-mitbewohner
    register: informal
    level: b1
    sender:
      name: Tobias
      relation: your former flatmate, now living in Vienna
    situation: >
      He has landed a job in Vienna and is slowly settling in, though the
      Austrian German still catches him out. He has found an old box of your
      things in his cellar and wants to know what to do with it. He is also
      a little homesick and in the mood for a proper catch-up.
    points:
      - React to his news about the job
      - Say what he should do with your box
      - Tell him about a change in your own life
      - Ask how he is finding Vienna

  - id: reise-einladung
    register: informal
    level: b1
    sender:
      name: Miriam
      relation: a friend who organises a hiking trip every year
    situation: >
      She is organising this year's trip — four days in the Black Forest in
      September, six people so far, sharing a holiday flat. She needs to book
      soon and wants to know if you are in. She also remembers that you were
      not thrilled with last year's route.
    points:
      - Say whether you want to come
      - Give a reason for your answer
      - Say what you would prefer to do differently this time
      - Ask about the cost and what to pack

  - id: alte-kollegin
    register: informal
    level: b1
    sender:
      name: Anja
      relation: a former colleague who has changed careers
    situation: >
      She has quit her office job and retrained as a carpenter. She is much
      happier but earning less and still doubts the decision on bad days. She
      is curious whether you have ever thought about changing direction too.
    points:
      - React to her career change
      - Say what you think about her decision
      - Tell her whether you have ever considered something similar
      - Ask how her family reacted

  - id: nachbarin-pflanzen
    register: informal
    level: a2
    sender:
      name: Beate
      relation: your neighbour from the flat downstairs
    situation: >
      She is going away for three weeks and would like you to water her
      plants and take in her post. She has left a key with the caretaker and
      wants to explain the details before she leaves on Friday.
    points:
      - Say whether you can help
      - Ask what exactly you need to do
      - Ask how to reach her while she is away
      - Wish her a good trip


  # ---- LEVEL-001 additions (2026-08-15): the level filter draws only from
  # the learner's own bucket, and A1 had ONE seed. Every bucket now has
  # several situations in both registers.

  - id: lisa-kino
    register: informal
    level: a1
    sender:
      name: Lisa
      relation: a friend from your German course
    situation: >
      She wants to go to the cinema on Friday evening and would like you to
      come along. She has not decided on a film or a time yet and is happy
      to go with whatever you prefer.
    points:
      - Say whether you want to come
      - Say which film you would like to see
      - Suggest a time
      - Ask where you should meet

  - id: markus-kurs
    register: informal
    level: a1
    sender:
      name: Markus
      relation: a classmate from your German course
    situation: >
      He was in class as usual this week, but the reader was not, and he
      noticed the empty seat. He hopes the reader is not ill. The teacher
      gave homework for Monday, and he offers to send it over if the reader
      wants it.
    points:
      - Explain why you were not in class
      - Say how you are now
      - Ask him to send you the homework
      - Thank him for his help

  - id: sabine-fahrrad
    register: informal
    level: a1
    sender:
      name: Sabine
      relation: a friend who is clearing out her cellar
    situation: >
      She has bought a new bicycle, so her old one is still standing in the
      cellar and she wants to sell it. It is in good condition, and she would
      rather offer it to a friend at a good price than to a stranger. She
      remembers you said you were looking for a bike and asks if you want it.
    points:
      - Say whether you are interested in the bike
      - Ask how much it costs
      - Ask when you can come and see it
      - Ask a question about the bike itself

  - id: paula-neue-nachbarin
    register: informal
    level: a1
    sender:
      name: Paula
      relation: your new neighbour, who moved in next door last week
    situation: >
      She is new to the building and to the city, and does not know anyone
      yet. She wants to introduce herself, is friendly and a little shy, and
      would like to know a bit about the neighbourhood.
    points:
      - Welcome her to the building
      - Say how long you have lived here
      - Recommend a shop or café nearby
      - Ask where she comes from

  - id: lena-praktikum
    register: informal
    level: a2
    sender:
      name: Lena
      relation: a friend who has just started an internship in Munich
    situation: >
      Her first week at the internship was long and stressful, but the team
      is nice and she is learning a lot. She has been too busy to write until
      now. She would love to visit you in autumn and wants to know how things
      are going on your side.
    points:
      - React to her news
      - Tell her about your own work or studies
      - Say when a visit in autumn would suit you
      - Ask what exactly she does at the internship

  - id: mehmet-umzug
    register: informal
    level: a2
    sender:
      name: Mehmet
      relation: a friend who is moving flat in two weeks
    situation: >
      He is moving to a flat across town on a Saturday and needs help
      carrying boxes. He is not sure yet how many friends can make it. He
      also has a bookshelf that will not fit into the new flat and would
      rather give it to a friend than throw it away.
    points:
      - Say whether you can help on Saturday
      - Say from what time you can be there
      - Say whether you would like the bookshelf
      - Ask how many people are helping

  - id: julia-hochzeit
    register: informal
    level: b1
    sender:
      name: Julia
      relation: a close friend who is getting married in June
    situation: >
      She and her partner are getting married in June, a small celebration
      in a garden restaurant near the lake. She really wants you there and
      would love it if you said a few words at the dinner, but she will
      understand if that is not your thing. She is still working out the
      details.
    points:
      - Congratulate her
      - Say whether you will come, and whether you will bring someone
      - Say whether you would give a short speech
      - Ask about the dress code or the venue

  - id: sarah-kanada
    register: informal
    level: b2
    sender:
      name: Sarah
      relation: a close friend at a crossroads
    situation: >
      She has been offered a two-year job in Canada — better pay, more
      responsibility, a city she has always wanted to live in. But her
      partner is hesitant, her mother is getting older, and she has never
      lived abroad. She keeps changing her mind and wants your honest
      opinion, not just encouragement.
    points:
      - Give your honest opinion on whether she should go
      - Name one advantage and one risk of going
      - Tell her about a big decision you once had to make
      - Ask when she has to decide

  # ------------------------------------------------------------------ formal
  - id: vermieter-termin
    register: formal
    level: b1
    sender:
      name: Herr Wagner
      relation: your landlord
    situation: >
      The heating in your flat has been reported as faulty. He has arranged
      for a technician to come on Tuesday between 8 and 12, and needs to know
      whether someone will be at home. If not, he asks you to propose two
      alternative dates in the next two weeks.
    points:
      - Confirm that you received his letter
      - Say whether Tuesday works for you
      - Propose two alternative dates
      - Ask to be told the technician's name in advance

  - id: vhs-kurs
    register: formal
    level: a2
    sender:
      name: Frau Dr. Lehmann
      relation: the course office at the Volkshochschule
    situation: >
      Your German course place is confirmed, but the course has been moved
      from Wednesday evening to Monday morning, which clashes with your work.
      The office asks you to confirm your place or say what you would like to
      do instead. Payment is due within two weeks.
    points:
      - Thank her for the confirmation
      - Explain why Monday morning is a problem for you
      - Ask whether an evening group is still available
      - Ask about the payment deadline

  - id: versicherung-unterlagen
    register: formal
    level: b2
    sender:
      name: Herr Özdemir
      relation: a caseworker at your insurance company
    situation: >
      Your claim cannot be processed because two documents are missing and a
      date on your form contradicts the one in an earlier letter. He needs the
      missing documents within fourteen days, otherwise the file will be
      closed, and asks you to clarify the discrepancy.
    points:
      - Apologise for the incomplete documents
      - Explain how the wrong date came about
      - Say when you will send the missing documents
      - Ask what happens if the deadline cannot be met

  # ---- LEVEL-001 additions (2026-08-15), formal register.

  - id: arztpraxis-termin
    register: formal
    level: a1
    sender:
      name: Frau Berger
      relation: the receptionist at your doctor's practice
    situation: >
      Your appointment on Thursday at 9 o'clock has to be moved because the
      doctor will not be in that day. The practice offers you two new times
      — Tuesday at 10 o'clock or Friday at 3 o'clock — and asks you to say
      which one you would like.
    points:
      - Thank her for the letter
      - Say which of the two new times you take
      - Ask what you need to bring
      - Ask how long the appointment will take

  - id: bibliothek-mahnung
    register: formal
    level: a2
    sender:
      name: Frau Krüger
      relation: a librarian at the city library
    situation: >
      A book you borrowed is two weeks overdue and someone else has reserved
      it. The library asks you to return it as soon as possible. There is a
      late fee, and the book cannot be extended because of the reservation.
    points:
      - Apologise for the delay
      - Explain why you could not return the book on time
      - Say when you will bring it back
      - Ask how much the fee is

  - id: nachbar-laerm
    register: formal
    level: b1
    sender:
      name: Herr Schulz
      relation: the neighbour in the flat above yours
    situation: >
      There was loud music and voices from your flat late on Saturday night,
      and he has small children who could not sleep. He is polite but
      clearly annoyed — this is not the first time — and would like it not
      to happen again. He suggests you talk about how to handle it.
    points:
      - Apologise and say what happened on Saturday
      - Explain what you will do differently
      - Propose a way to handle it next time
      - Ask him to speak to you directly if it happens again
