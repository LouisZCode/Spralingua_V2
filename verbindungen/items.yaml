    chunk: "sprechen stem-changes e→i for du/er/sie/es: du sprichst, er/sie spricht"
    hint: "Same stem shift as 'sie' — but for 'du'?"

  - id: sve-nehmen-er
    pattern_id: subjekt-verb-endung
