  # ── subjekt-verb-endung — all six persons, stem-changers (fahren/ ───────
  # ── sprechen/nehmen) and -t/-d stems needing an extra e (arbeiten/finden) ─
  - id: sve-wohnen-du
    pattern_id: subjekt-verb-endung
    frame: "Ich wohne in Berlin. Du ___ in Hamburg."
    answer: "wohnst"
    chunk: "ich -e · du -st · er/sie/es -t · wir/ihr/sie/Sie -en/-t"
    hint: "Which ending goes with 'du'?"

  - id: sve-wohnen-ich
    pattern_id: subjekt-verb-endung
    frame: "Du wohnst in Berlin. Ich ___ in München."
    answer: "wohne"
    chunk: "ich -e · du -st · er/sie/es -t · wir/ihr/sie/Sie -en/-t"
    hint: "Which ending goes with 'ich'?"

