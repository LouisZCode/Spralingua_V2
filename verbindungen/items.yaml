  # ══════════════════════════════════════════════════════════════════════
  # A1/A2 hygiene batch — five patterns with NO exercise anywhere else in
  # the app. Unlike the chunk patterns above, `chunk` here carries the RULE
  # itself (a compact contrast line to memorize), and `hint` points at the
  # decision rather than translating the sentence.
  # ══════════════════════════════════════════════════════════════════════

  # ── nicht-vs-kein — both directions, including the traps: negating a ────
  # ── verb, an adjective, and a definite/possessive noun (kein impossible) ─
  - id: nvk-auto-01
    pattern_id: nicht-vs-kein
    frame: "Ich habe ___ Auto."
    answer: "kein"
    chunk: "kein + noun · nicht + verb or adjective"
    # The old hint ("Are you negating a thing, or an action?") presupposed
    # negation without ever stating it, so "ein" was a perfectly valid
    # answer and a learner picked it in production (2026-08-14). Every
    # other nicht-vs-kein item names the task; this one now does too.
    hint: "You don't own a car — negate the noun."

  - id: nvk-zeit
    pattern_id: nicht-vs-kein
    frame: "Ich habe heute ___ Zeit."
    answer: "keine"
    chunk: "kein + noun · nicht + verb or adjective"
    hint: "Same decision as always — but 'Zeit' is feminine."

  - id: nvk-hund
    pattern_id: nicht-vs-kein
    frame: "Wir haben ___ Hund."
    answer: "keinen"
    chunk: "kein + noun · nicht + verb or adjective (kein still takes case endings: keinen for a masc. direct object)"
    hint: "'Hund' is masculine and it's a direct object — which ending?"

  - id: nvk-kinder
    pattern_id: nicht-vs-kein
    frame: "Sie haben ___ Kinder."
    answer: "keine"
    chunk: "kein + noun · nicht + verb or adjective (plural also takes keine)"
    hint: "Plural nouns take the same ending as feminine — which word?"

  - id: nvk-arbeite-heute
    pattern_id: nicht-vs-kein
    frame: "Ich arbeite heute ___."
    answer: "nicht"
    chunk: "kein + noun · nicht + verb or adjective"
    hint: "There's no noun here to negate — what are you negating instead?"

  - id: nvk-schoen
    pattern_id: nicht-vs-kein
    frame: "Das Wetter ist heute ___ schön."
    answer: "nicht"
    chunk: "kein + noun · nicht + verb or adjective"
    hint: "'schön' is an adjective, not a noun — which negator fits?"

  - id: nvk-mein-auto
    pattern_id: nicht-vs-kein
    frame: "Das ist ___ mein Auto."
    answer: "nicht"
    chunk: "kein can't attach to a noun that already has an article or possessive — use nicht instead"
    hint: "'mein Auto' already has a possessive in front of it — can 'kein' go there too?"

  - id: nvk-den-film
    pattern_id: nicht-vs-kein
    frame: "Ich mag den Film ___."
    answer: "nicht"
    chunk: "kein can't attach to a noun that already has an article or possessive — use nicht instead"
    hint: "'den Film' already has its own article — which negator works with that?"

  - id: nvk-kaffee
    pattern_id: nicht-vs-kein
    frame: "Er trinkt ___ Kaffee."
    answer: "keinen"
    chunk: "kein + noun · nicht + verb or adjective (kein still takes case endings: keinen for a masc. direct object)"
    hint: "'Kaffee' is masculine and it's a direct object — which ending?"

  - id: nvk-mitkommen
    pattern_id: nicht-vs-kein
    frame: "Er kommt heute ___ mit."
    answer: "nicht"
    chunk: "kein + noun · nicht + verb or adjective"
    hint: "This negates the whole action of coming along — which negator?"

  - id: nvk-gibt-supermarkt
    pattern_id: nicht-vs-kein
    frame: "Hier gibt es ___ Supermarkt."
    answer: "keinen"
    chunk: "kein + noun · nicht + verb or adjective (kein still takes case endings: keinen for a masc. direct object)"
    hint: "'Supermarkt' is masculine and it's a direct object — which ending?"

  - id: nvk-verstehe
    pattern_id: nicht-vs-kein
    frame: "Ich verstehe das ___."
    answer: "nicht"
    chunk: "kein + noun · nicht + verb or adjective"
    hint: "There's no noun after the verb here — what are you negating?"

  - id: nvk-teuer
    pattern_id: nicht-vs-kein
    frame: "Die Wohnung ist ___ teuer."
    answer: "nicht"
    chunk: "kein + noun · nicht + verb or adjective"
    hint: "'teuer' describes the apartment — adjective or noun?"

  # ── sein-vs-haben — the fixed pairs where English reaches for the ───────
