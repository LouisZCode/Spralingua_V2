  # ── da-/wo-komposita — refer back / ask with the compound ────────────────
  - id: fv-darauf-konzert
    pattern_id: da-wo-komposita
    frame: "Freust du dich auf das Konzert? — Ja, ich freue mich sehr ___."
    answer: darauf
    chunk: da + auf → darauf (refers back to a thing)
    hint: Are you looking forward to the concert? — Yes, I'm really looking forward to it.

  - id: fv-worauf-frage
    pattern_id: da-wo-komposita
