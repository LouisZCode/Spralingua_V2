    answer: "habe"
    chunk: "Hunger, Durst, Angst, Recht → haben · müde, Jahre alt → sein"
    hint: "Hunger is a fixed haben-pair in German, unlike English 'I am hungry'."

  - id: svh-durst-ich
    pattern_id: sein-vs-haben
