  - id: svh-wie-alt-sie-formal
    pattern_id: sein-vs-haben
    frame: "Wie alt ___ Sie?"
    answer: "sind"
    chunk: "Hunger, Durst, Angst, Recht → haben · müde, Jahre alt → sein"
    hint: "Formal 'Sie' asking age — which verb?"

  - id: svh-angst-kinder
    pattern_id: sein-vs-haben
    frame: "Die Kinder ___ Angst vor dem Hund."
    answer: "haben"
    chunk: "Hunger, Durst, Angst, Recht → haben · müde, Jahre alt → sein"
