    pattern_id: als-vs-wenn
    frame: "___ ich klein war, habe ich in Spanien gewohnt."
    answer: "Als"
    chunk: "a one-time (even if long) past situation → als · a repeated past event or a condition → wenn"
    hint: "When I was little, I lived in Spain."

  - id: avw-frau-treffen
    pattern_id: als-vs-wenn
    frame: "___ ich meine Frau zum ersten Mal traf, war ich neunzehn."
