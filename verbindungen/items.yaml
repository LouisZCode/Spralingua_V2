# Feste Verbindungen item catalog (GRAM-002, Exercise D) — complete the fixed
# verb chunk: reflexive pronoun (if the verb takes one), fixed preposition,
# and/or the article in the case the preposition governs. Content-as-data;
# verbindungen/content.py validates fail-loud at startup.
#
# Fields per item (all required):
#   id         — stable slug
#   pattern_id — grammar/taxonomy.yaml id (reflexivpronomen |
#                verben-mit-praepositionen | da-wo-komposita)
#   frame      — the sentence with ONE ___ gap spanning the chunk region
#   answer     — the words that fill the gap
#   chunk      — the canonical chunk to memorize, shown AFTER the verdict
#                ("sich freuen auf + Akkusativ") — never before (it would
#                answer the item)
#   hint       — English rendering of the full sentence
#
# THE MIX IS THE MECHANISM (design rule 1, the user's own finding: pronouns
# 10/10 when drilled alone, chunks 2/10 when mixed): reflexive verbs are
# interleaved with non-reflexive decoys in the same gap position, so "does
# this verb even take a pronoun?" stays the live question. Same for the
# article items: the case is never announced, the preposition governs it.

items:
  # ── reflexivpronomen — reflexive chunks MIXED with non-reflexive decoys ──
  - id: fv-freuen-auf
    pattern_id: reflexivpronomen
    frame: "Ich freue ___ das Wochenende."
    answer: mich auf
    chunk: sich freuen auf + Akkusativ
    hint: I'm looking forward to the weekend.

  - id: fv-warten-decoy
