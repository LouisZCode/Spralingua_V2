    # fronts and the subject drops to third; the prefix still closes it.
    accepts:
      - ["um", "sieben", "stehe", "ich", "auf"]
    hint: "aufstehen splits — the prefix auf waits at the very end, wherever the sentence starts."
    rule: "aufstehen splits: stehe … auf — Ich stehe um sieben auf (or Um sieben stehe ich auf)."

