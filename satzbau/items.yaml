  # ── trennbare-verben — CLARA-14 Phase B: prefix splits off and closes the
  # main clause. given is "" — the whole clause is chips. Four items open
  # with a frontable time adverb (um sieben / samstags / abends / um acht);
  # German lets that adverb front to slot one just as naturally as it lets
  # the subject lead — both orders are common, unmarked daily-routine
  # German, so BOTH are listed: the accepts entry is the same chips with
  # the adverb first and the subject bumped to third. The other two items
  # carry only a direct object (no separate adverbial), which German
  # speakers do not front in a neutral, out-of-context statement — fronting
  # an object there is a marked, contrastive reading, not a second natural
  # rendering of the same flat task, so those two stay single-order.
  - id: tv-aufstehen-sieben
