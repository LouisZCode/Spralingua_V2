# Situation pack: office life — meetings, deadlines, colleagues.
# n-termin and v-teilnehmen were original mock-deck cards — real content now.
# Authored per .claude/skills/satz-cards/SKILL.md.
id: at-work
title: At Work
description: Meetings, deadlines, and colleagues — office German
kind: situation
level: A2
position: 6
cards:
  - id: n-termin
    type: noun
    target: Termin
    article: der
    level: A2
    gloss: the appointment
    note: "masculine · plural: die Termine"
    example: Ich habe morgen einen Termin beim Arzt.

  - id: n-besprechung
    type: noun
    target: Besprechung
    article: die
    level: B1
    gloss: the meeting
    note: "feminine · plural: die Besprechungen"
    example: Die Besprechung beginnt um neun Uhr.

  - id: n-feierabend
    type: noun
    target: Feierabend
    article: der
    level: A2
    gloss: the end of the workday
    note: "masculine · plural: die Feierabende"
    example: Ich mache heute um fünf Feierabend.

  - id: n-kollege
    type: noun
    target: Kollege
    article: der
    level: A2
    gloss: the colleague
    note: "masculine · plural: die Kollegen"
    example: Mein Kollege hilft mir bei dem Projekt.

  - id: v-teilnehmen
    type: verb
    target: teilnehmen
    level: B1
    gloss: to take part in
    example: Sie nimmt an dem Kurs teil.

  # CONT-003: spoken-past sibling — separable (teil + nehmen, strong:
  # nehmen/nahm/genommen), ge- lands between the prefix and the stem.
  - id: v-teilnehmen-past
    type: verb
    target: teilnehmen
    level: B1
    gloss: to take part in
    tense: past
    tense_form: hat teilgenommen
    example: Sie hat an dem Kurs teilgenommen.

  - id: v-erledigen
    type: verb
    target: erledigen
    level: B1
    gloss: to get done / take care of
    example: Ich erledige das bis morgen.

  # CONT-003: spoken-past sibling — inseparable er- prefix, no ge-.
  - id: v-erledigen-past
    type: verb
    target: erledigen
    level: B1
    gloss: to get done / take care of
    tense: past
    tense_form: hat erledigt
    example: Ich habe das gestern erledigt.

  - id: v-verschieben
    type: verb
    target: verschieben
    level: B1
    gloss: to postpone
    example: Können wir den Termin verschieben?

  # CONT-003: spoken-past sibling — inseparable ver- prefix (schieben/
  # geschoben), no ge-.
  - id: v-verschieben-past
    type: verb
    target: verschieben
    level: B1
    gloss: to postpone
    tense: past
    tense_form: hat verschoben
    example: Wir haben den Termin verschoben.

  - id: v-melden
    type: verb
    target: melden
    reflexive: true
    level: B1
    gloss: to get in touch
    example: Ich melde mich morgen bei Ihnen.

  # CONT-003: spoken-past sibling — reflexive, weak verb, hat sich + ge-.
  - id: v-melden-past
    type: verb
    target: melden
    reflexive: true
    level: B1
    gloss: to get in touch
    tense: past
    tense_form: hat sich gemeldet
    example: Er hat sich gestern bei mir gemeldet.

  - id: p-geht-klar
    type: phrase
    target: Geht klar.
    level: A2
    gloss: '"Sure thing / will do."'
    note: spoken · casual
    example: „Schickst du mir die Datei?" – „Geht klar."

  - id: p-auf-dem-laufenden
    type: phrase
    target: auf dem Laufenden halten
    level: B1
    gloss: '"to keep (someone) posted"'
    note: collocation · office talk
    example: Halten Sie mich bitte auf dem Laufenden.

  - id: n-buero
    type: noun
    target: Büro
    article: das
    level: A2
    gloss: the office
    note: "neuter · plural: die Büros"
    example: Ich bin heute nicht im Büro.

  - id: n-urlaub
    type: noun
    target: Urlaub
    article: der
    level: A2
    gloss: the vacation
    note: "masculine · plural: die Urlaube"
    example: Ich habe im August Urlaub.

  - id: n-e-mail
    type: noun
    target: E-Mail
    article: die
    level: A2
    gloss: the email
    note: "feminine · plural: die E-Mails"
    example: Ich schicke Ihnen die Unterlagen per E-Mail.

  - id: v-anrufen
    type: verb
    target: anrufen
    level: B1
    gloss: to call (on the phone)
    example: Ich rufe Sie morgen nach dem Meeting an.

  # CONT-003: spoken-past sibling — separable (an + rufen, strong:
  # rufen/rief/gerufen), ge- lands between the prefix and the stem.
  - id: v-anrufen-past
    type: verb
    target: anrufen
    level: B1
    gloss: to call (on the phone)
    tense: past
    tense_form: hat angerufen
    example: Er hat mich leider nicht angerufen.

  - id: v-arbeiten
    type: verb
    target: arbeiten
    level: A2
    gloss: to work
    example: Ich arbeite von zu Hause.

  # CONT-003: spoken-past sibling — weak verb, no prefix, hat + ge-.
  - id: v-arbeiten-past
    type: verb
    target: arbeiten
    level: A2
    gloss: to work
    tense: past
    tense_form: hat gearbeitet
    example: Sie hat bis spät in die Nacht gearbeitet.

  - id: v-kuendigen
    type: verb
    target: kündigen
    level: B1
    gloss: to quit (a job)
    example: Sie will ihre Stelle kündigen.

  # CONT-003: spoken-past sibling — weak verb, no prefix, hat + ge-.
  - id: v-kuendigen-past
    type: verb
    target: kündigen
    level: B1
    gloss: to quit (a job)
    tense: past
    tense_form: hat gekündigt
    example: Er hat bei der Firma gekündigt.

  - id: p-ich-habe-da-eine-frage
    type: phrase
    target: Ich habe da eine Frage.
    level: B1
    gloss: '"I have a question."'
    note: collocation · meetings
    example: Ich habe da eine Frage zum neuen Ablauf.

  - id: p-schoenen-feierabend
    type: phrase
    target: Schönen Feierabend!
    level: A2
    gloss: '"Enjoy your evening off!"'
    note: spoken · leaving work
    example: „Ich gehe dann mal." – „Schönen Feierabend!"

  - id: p-das-passt-mir
    type: phrase
    target: Das passt mir gut.
    level: A2
    gloss: '"That works for me."'
    note: spoken · scheduling
    example: „Dienstag um zehn?" – „Das passt mir gut."

  - id: p-in-ordnung
    type: phrase
    target: In Ordnung.
    level: A2
    gloss: '"Understood. / That''s fine."'
    note: spoken · neutral
    example: „Das Meeting fällt aus." – „In Ordnung, danke."
