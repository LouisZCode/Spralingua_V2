# Level pack: intermediate everyday vocabulary. Home of the reflexive verbs
# the trainer teaches by omission (sich hidden on the clue).
# Authored per .claude/skills/satz-cards/SKILL.md.
id: b1-everyday
title: B1 Everyday
description: Intermediate words for opinions, plans, and daily life
kind: level
level: B1
position: 2
cards:
  - id: n-erfahrung
    type: noun
    target: Erfahrung
    article: die
    level: B1
    gloss: the experience
    note: "feminine · plural: die Erfahrungen"
    example: Ich habe viel Erfahrung mit Kindern.

  - id: n-vorschlag
    type: noun
    target: Vorschlag
    article: der
    level: B1
    gloss: the suggestion / proposal
    note: "masculine · plural: die Vorschläge"
    example: Das ist ein guter Vorschlag.

  - id: n-umgebung
    type: noun
    target: Umgebung
    article: die
    level: B1
    gloss: the surroundings / area
    note: "feminine · plural: die Umgebungen"
    example: Die Umgebung ist sehr ruhig.

  - id: n-gewohnheit
    type: noun
    target: Gewohnheit
    article: die
    level: B1
    gloss: the habit
    note: "feminine · plural: die Gewohnheiten"
    example: Früh aufstehen ist eine gute Gewohnheit.

  - id: v-freuen
    type: verb
    target: freuen
    reflexive: true
    level: B1
    gloss: to look forward to
    example: Ich freue mich auf das Wochenende.

  # CONT-003: spoken-past sibling. NOTE — this id already existed as a
  # community card (a learner forged "freuen" by hand before this pack
  # sibling was authored); its content is reused verbatim (already fact-
  # checked by the SATZ-021 verify gate) rather than re-authored, so the
  # seed's upsert-on-id is a content no-op. See results.md for why.
  - id: v-freuen-past
    type: verb
    target: freuen
    reflexive: true
    level: B1
    gloss: to look forward to
    tense: past
    tense_form: freute sich · hat sich gefreut
    example: Er freute sich über das Geschenk.

  - id: v-erinnern
    type: verb
    target: erinnern
    reflexive: true
    level: B1
    gloss: to remember
    example: Ich erinnere mich an meinen ersten Schultag.

  # CONT-003: spoken-past sibling — reflexive, inseparable er- prefix, no ge-.
  - id: v-erinnern-past
    type: verb
    target: erinnern
    reflexive: true
    level: B1
    gloss: to remember
    tense: past
    tense_form: hat sich erinnert
    example: Er hat sich an seinen ersten Schultag erinnert.

  - id: v-vorschlagen
    type: verb
    target: vorschlagen
    level: B1
    gloss: to suggest
    example: Ich schlage vor, dass wir früher anfangen.

  # CONT-003: spoken-past sibling — separable (vor + schlagen, strong:
  # schlagen/geschlagen), ge- lands between the prefix and the stem.
  - id: v-vorschlagen-past
    type: verb
    target: vorschlagen
    level: B1
    gloss: to suggest
    tense: past
    tense_form: hat vorgeschlagen
    example: Ich habe vorgeschlagen, dass wir früher anfangen.

  - id: v-verbringen
    type: verb
    target: verbringen
    level: B1
    gloss: to spend (time)
    example: Wir verbringen den Sommer am See.

  # CONT-003: spoken-past sibling — inseparable ver- prefix, mixed verb
  # (bringen/brachte/gebracht), no ge-.
  - id: v-verbringen-past
    type: verb
    target: verbringen
    level: B1
    gloss: to spend (time)
    tense: past
    tense_form: hat verbracht
    example: Wir haben den Sommer am See verbracht.

  - id: p-kommt-darauf-an
    type: phrase
    target: Das kommt darauf an.
    level: B1
    gloss: '"That depends."'
    note: spoken · neutral register
    example: „Kommst du mit?" – „Das kommt darauf an."

  - id: p-es-lohnt-sich
    type: phrase
    target: Es lohnt sich.
    level: B1
    gloss: '"It''s worth it."'
    note: spoken · neutral register
    example: Der Film ist toll — es lohnt sich!

  - id: n-meinung
    type: noun
    target: Meinung
    article: die
    level: B1
    gloss: the opinion
    note: "feminine · plural: die Meinungen"
    example: Meiner Meinung nach ist der Film zu lang.

  - id: n-alltag
    type: noun
    target: Alltag
    article: der
    level: B1
    gloss: the everyday life / routine
    note: masculine · usually no plural
    example: Der Alltag mit zwei Kindern ist anstrengend.

  - id: n-verabredung
    type: noun
    target: Verabredung
    article: die
    level: B1
    gloss: the arrangement / date
    note: "feminine · plural: die Verabredungen"
    example: Ich habe heute Abend eine Verabredung.

  - id: v-aergern
    type: verb
    target: ärgern
    reflexive: true
    level: B1
    gloss: to be annoyed (about)
    example: Ich ärgere mich über den ständigen Lärm.

  # CONT-003: spoken-past sibling — reflexive, weak verb, hat sich + ge-.
  - id: v-aergern-past
    type: verb
    target: ärgern
    reflexive: true
    level: B1
    gloss: to be annoyed (about)
    tense: past
    tense_form: hat sich geärgert
    example: Sie hat sich über die Verspätung geärgert.

  - id: v-aufpassen
    type: verb
    target: aufpassen
    level: B1
    gloss: to pay attention / watch out
    example: Pass auf, wenn du die Straße überquerst.

  # CONT-003: spoken-past sibling — separable (auf + passen), ge- lands
  # between the prefix and the stem.
  - id: v-aufpassen-past
    type: verb
    target: aufpassen
    level: B1
    gloss: to pay attention / watch out
    tense: past
    tense_form: hat aufgepasst
    example: Ich habe nicht aufgepasst und die Haltestelle verpasst.

  - id: v-ausgeben
    type: verb
    target: ausgeben
    level: B1
    gloss: to spend (money)
    example: Ich gebe gern Geld für gute Bücher aus.

  # CONT-003: spoken-past sibling — separable (aus + geben, strong:
  # geben/gab/gegeben), ge- lands between the prefix and the stem.
  - id: v-ausgeben-past
    type: verb
    target: ausgeben
    level: B1
    gloss: to spend (money)
    tense: past
    tense_form: hat ausgegeben
    example: Sie hat ihr ganzes Gehalt für das Kleid ausgegeben.

  - id: p-stimmt
    type: phrase
    target: Stimmt.
    level: B1
    gloss: '"True. / Right."'
    note: spoken · agreeing
    example: „Montags hat der Laden zu." – „Stimmt."

  - id: p-so-ein-mist
    type: phrase
    target: So ein Mist!
    level: B1
    gloss: '"Darn it!"'
    note: spoken · casual frustration
    example: So ein Mist, ich habe den Schlüssel vergessen!

  - id: p-ehrlich-gesagt
    type: phrase
    target: Ehrlich gesagt …
    level: B1
    gloss: '"Honestly, …"'
    note: spoken · opinion opener
    example: Ehrlich gesagt finde ich den Plan zu teuer.

  - id: p-machs-gut
    type: phrase
    target: Mach's gut!
    level: B1
    gloss: '"Take care!"'
    note: spoken · casual goodbye
    example: „Ich muss los." – „Alles klar, mach's gut!"
