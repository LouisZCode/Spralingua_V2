# Level pack: absolute-beginner core vocabulary.
# Authored per .claude/skills/satz-cards/SKILL.md — noun/verb/reflexive rules.
id: a1-basics
title: A1 Basics
description: The everyday words every beginner sentence needs
kind: level
level: A1
position: 1
cards:
  - id: n-frage
    type: noun
    target: Frage
    article: die
    level: A1
    gloss: the question
    note: "feminine · plural: die Fragen"
    example: Ich habe eine Frage.

  - id: n-antwort
    type: noun
    target: Antwort
    article: die
    level: A1
    gloss: the answer
    note: "feminine · plural: die Antworten"
    example: Die Antwort ist richtig.

  - id: n-stadt
    type: noun
    target: Stadt
    article: die
    level: A1
    gloss: the city
    note: "feminine · plural: die Städte"
    example: Berlin ist eine große Stadt.

  - id: n-haus
    type: noun
    target: Haus
    article: das
    level: A1
    gloss: the house
    note: "neuter · plural: die Häuser"
    example: Unser Haus ist klein.

  - id: v-wohnen
    type: verb
    target: wohnen
    level: A1
    gloss: to live (reside)
    example: Ich wohne in Berlin.

  # CONT-003: spoken-past sibling — weak verb, no prefix, hat + ge-.
  - id: v-wohnen-past
    type: verb
    target: wohnen
    level: A1
    gloss: to live (reside)
    tense: past
    tense_form: hat gewohnt
    example: Er hat lange in München gewohnt.

  - id: v-brauchen
    type: verb
    target: brauchen
    level: A1
    gloss: to need
    example: Wir brauchen Milch und Brot.

  # CONT-003: spoken-past sibling — weak verb, no prefix, hat + ge-.
  - id: v-brauchen-past
    type: verb
    target: brauchen
    level: A1
    gloss: to need
    tense: past
    tense_form: hat gebraucht
    example: Ich habe gestern deine Hilfe gebraucht.

  - id: v-helfen
    type: verb
    target: helfen
    level: A1
    gloss: to help
    example: Kannst du mir helfen?

  # CONT-003: spoken-past sibling — strong verb (helfen, half, geholfen), hat + ge-.
  - id: v-helfen-past
    type: verb
    target: helfen
    level: A1
    gloss: to help
    tense: past
    tense_form: hat geholfen
    example: Er hat mir bei den Hausaufgaben geholfen.

  - id: v-verstehen
    type: verb
    target: verstehen
    level: A1
    gloss: to understand
    example: Ich verstehe die Frage nicht.

  # CONT-003: spoken-past sibling. NOTE — this id already existed as a
  # community card (a learner forged "verstehen" by hand before this pack
  # sibling was authored); its content is reused verbatim (already fact-
  # checked by the SATZ-021 verify gate) rather than re-authored, so the
  # seed's upsert-on-id is a content no-op. See results.md for why.
  - id: v-verstehen-past
    type: verb
    target: verstehen
    level: A1
    gloss: to understand
    tense: past
    tense_form: hat verstanden
    example: Er hat die Erklärung nicht verstanden.

  - id: p-wie-bitte
    type: phrase
    target: Wie bitte?
    level: A1
    gloss: '"Pardon? / Come again?"'
    note: spoken · polite
    example: Wie bitte? Können Sie das bitte wiederholen?

  - id: p-keine-ahnung
    type: phrase
    target: Keine Ahnung.
    level: A1
    gloss: '"No idea."'
    note: spoken · casual
    example: „Wo ist Tom?" – „Keine Ahnung."

  - id: n-tag
    type: noun
    target: Tag
    article: der
    level: A1
    gloss: the day
    note: "masculine · plural: die Tage"
    example: Heute ist ein schöner Tag.

  - id: n-zeit
    type: noun
    target: Zeit
    article: die
    level: A1
    gloss: the time
    note: feminine · usually no plural
    example: Ich habe heute keine Zeit.

  - id: n-geld
    type: noun
    target: Geld
    article: das
    level: A1
    gloss: the money
    note: neuter · usually no plural
    example: Ich habe kein Geld dabei.

  - id: v-machen
    type: verb
    target: machen
    level: A1
    gloss: to do / make
    example: Was machst du heute?

  # CONT-003: spoken-past sibling — weak verb, no prefix, hat + ge-.
  - id: v-machen-past
    type: verb
    target: machen
    level: A1
    gloss: to do / make
    tense: past
    tense_form: hat gemacht
    example: Ich habe die Hausaufgaben gemacht.

  - id: v-essen
    type: verb
    target: essen
    level: A1
    gloss: to eat
    example: Wir essen um zwölf Uhr.

  # CONT-003: spoken-past sibling — strong verb (essen/aß/gegessen), hat + ge-.
  - id: v-essen-past
    type: verb
    target: essen
    level: A1
    gloss: to eat
    tense: past
    tense_form: hat gegessen
    example: Wir haben zusammen Pizza gegessen.

  - id: v-lesen
    type: verb
    target: lesen
    level: A1
    gloss: to read
    example: Ich lese gern Bücher.

  # CONT-003: spoken-past sibling — strong verb (lesen/las/gelesen), hat + ge-.
  - id: v-lesen-past
    type: verb
    target: lesen
    level: A1
    gloss: to read
    tense: past
    tense_form: hat gelesen
    example: Sie hat das ganze Buch gelesen.

  - id: p-noch-einmal-bitte
    type: phrase
    target: Noch einmal, bitte.
    level: A1
    gloss: '"One more time, please."'
    note: spoken · polite
    example: Noch einmal, bitte. Das war zu schnell.

  - id: p-natuerlich
    type: phrase
    target: Natürlich!
    level: A1
    gloss: '"Of course!"'
    note: spoken · casual
    example: „Kannst du morgen kommen?" – „Natürlich!"

  - id: p-bis-bald
    type: phrase
    target: Bis bald!
    level: A1
    gloss: '"See you soon!"'
    note: spoken · casual
    example: „Danke, tschüss!" – „Bis bald!"

  - id: p-alles-klar
    type: phrase
    target: Alles klar.
    level: A1
    gloss: '"All right. / Okay."'
    note: spoken · casual
    example: „Wir treffen uns um acht." – „Alles klar."
