# Situation pack: the job interview — applying, self-presentation, salary.
# n-erfahrung is reused from b1-everyday via ref (defined once, shared).
# Authored per .claude/skills/satz-cards/SKILL.md.
id: job-interview
title: Job Interview
description: Apply, present yourself, and talk salary
kind: situation
level: B1
position: 5
cards:
  - id: n-vorstellungsgespraech
    type: noun
    target: Vorstellungsgespräch
    article: das
    level: B1
    gloss: the job interview
    note: "neuter · plural: die Vorstellungsgespräche"
    example: Morgen habe ich ein Vorstellungsgespräch.

  - id: n-staerke
    type: noun
    target: Stärke
    article: die
    level: B1
    gloss: the strength
    note: "feminine · plural: die Stärken"
    example: Teamarbeit ist eine meiner Stärken.

  - id: n-schwaeche
    type: noun
    target: Schwäche
    article: die
    level: B1
    gloss: the weakness
    note: "feminine · plural: die Schwächen"
    example: Ungeduld ist meine größte Schwäche.

  - id: n-gehalt
    type: noun
    target: Gehalt
    article: das
    level: B2
    gloss: the salary
    note: "neuter · plural: die Gehälter"
    example: Das Gehalt wird am Ende des Gesprächs verhandelt.

  - ref: n-erfahrung

  - id: v-bewerben
    type: verb
    target: bewerben
    reflexive: true
    level: B1
    gloss: to apply (for a job)
    example: Ich bewerbe mich um diese Stelle.

  # CONT-003: spoken-past sibling — reflexive, strong verb (werben/geworben),
  # inseparable be- prefix, no ge-.
  - id: v-bewerben-past
    type: verb
    target: bewerben
    reflexive: true
    level: B1
    gloss: to apply (for a job)
    tense: past
    tense_form: hat sich beworben
    example: Sie hat sich um die Stelle beworben.

  - id: v-vorstellen
    type: verb
    target: vorstellen
    reflexive: true
    level: B1
    gloss: to introduce oneself
    example: Darf ich mich kurz vorstellen?

  # CONT-003: spoken-past sibling — reflexive, separable (vor + stellen),
  # ge- lands between the prefix and the stem.
  - id: v-vorstellen-past
    type: verb
    target: vorstellen
    reflexive: true
    level: B1
    gloss: to introduce oneself
    tense: past
    tense_form: hat sich vorgestellt
    example: Er hat sich kurz vorgestellt.

  - id: v-verhandeln
    type: verb
    target: verhandeln
    level: B2
    gloss: to negotiate
    example: Über das Gehalt kann man verhandeln.

  # CONT-003: spoken-past sibling — inseparable ver- prefix, no ge-.
  - id: v-verhandeln-past
    type: verb
    target: verhandeln
    level: B2
    gloss: to negotiate
    tense: past
    tense_form: hat verhandelt
    example: Sie haben lange über den Preis verhandelt.

  - id: v-einstellen
    type: verb
    target: einstellen
    level: B2
    gloss: to hire
    example: Die Firma stellt dieses Jahr neue Leute ein.

  # CONT-003: spoken-past sibling — separable (ein + stellen), ge- lands
  # between the prefix and the stem.
  - id: v-einstellen-past
    type: verb
    target: einstellen
    level: B2
    gloss: to hire
    tense: past
    tense_form: hat eingestellt
    example: Die Firma hat letztes Jahr zehn neue Mitarbeiter eingestellt.

  - id: p-unter-druck
    type: phrase
    target: unter Druck arbeiten
    level: B2
    gloss: '"to work under pressure"'
    note: collocation · job talk
    example: Ich kann gut unter Druck arbeiten.

  - id: n-ausbildung
    type: noun
    target: Ausbildung
    article: die
    level: B1
    gloss: the (vocational) training
    note: "feminine · plural: die Ausbildungen"
    example: Ich habe eine Ausbildung zum Elektriker abgeschlossen.

  - id: n-lebenslauf
    type: noun
    target: Lebenslauf
    article: der
    level: B1
    gloss: the CV / résumé
    note: "masculine · plural: die Lebensläufe"
    example: Bitte bringen Sie Ihren Lebenslauf mit.

  - id: n-stelle
    type: noun
    target: Stelle
    article: die
    level: B1
    gloss: the job / position
    note: "feminine · plural: die Stellen"
    example: Die Stelle ist noch offen.

  - id: v-vermitteln
    type: verb
    target: vermitteln
    level: B2
    gloss: to convey (skills / an impression)
    example: Man sollte im Interview seine Stärken klar vermitteln.

  # CONT-003: spoken-past sibling — inseparable ver- prefix, no ge-.
  - id: v-vermitteln-past
    type: verb
    target: vermitteln
    level: B2
    gloss: to convey (skills / an impression)
    tense: past
    tense_form: hat vermittelt
    example: Sie hat ihre Motivation gut vermittelt.

  # Reused from other packs via ref (defined once): convincing the panel
  # and the "why did you leave?" question are interview staples.
  - ref: v-ueberzeugen
  - ref: v-ueberzeugen-past
  - ref: v-kuendigen
  - ref: v-kuendigen-past

  - id: p-ich-arbeite-gern-im-team
    type: phrase
    target: Ich arbeite gern im Team.
    level: B1
    gloss: '"I enjoy working in a team."'
    note: collocation · interviews
    example: Ich arbeite gern im Team, kann aber auch selbstständig arbeiten.

  - id: p-das-ist-eine-gute-frage
    type: phrase
    target: Das ist eine gute Frage.
    level: B1
    gloss: '"That''s a good question."'
    note: spoken · buying time
    example: Das ist eine gute Frage. Ich habe mich damit noch nicht beschäftigt.

  - id: p-lust-auf-neue-aufgaben
    type: phrase
    target: Ich habe Lust auf neue Aufgaben.
    level: B1
    gloss: '"I''m keen on new challenges."'
    note: collocation · motivation talk
    example: Nach fünf Jahren im alten Job habe ich Lust auf neue Aufgaben.

  - id: p-ich-bringe-erfahrung-mit
    type: phrase
    target: Ich bringe viel Erfahrung mit.
    level: B1
    gloss: '"I bring a lot of experience."'
    note: collocation · interviews
    example: Ich bringe fünf Jahre Erfahrung im Vertrieb mit.
